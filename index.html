<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xüsusi Geyim və Çap Xidmətləri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Qayda 2: Slayd zamanı sürüşmə dayandırılır, kataloqda isə aktivləşir */
        html.scroll-active, body.scroll-active {
            overflow-y: auto !important;
            height: auto !important;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            overflow: hidden; 
        }

        /* --- SLAYDER (Köhnə Səhifə) --- */
        #sliderView {
            position: absolute;
            inset: 0;
            z-index: 10;
            transition: opacity 1s ease-in-out, transform 1s cubic-bezier(0.65, 0, 0.15, 1);
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1.2s ease-in-out;
            z-index: 1;
        }

        #bg1 { opacity: 1; }
        #bg2 { opacity: 0; }

        .glass-overlay {
            position: absolute;
            inset: 0;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.85));
            z-index: 2;
        }

        .main-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Qayda 1: Dairə biraz kiçildildi və yuxarı çəkildi ki, mətnlərə və düyməyə yer açılsın */
        .circle-positioner {
            position: relative;
            width: 60vh;
            height: 60vh;
            margin-top: -10vh;
            margin-bottom: 2vh;
            flex-shrink: 0;
        }

        .circle-spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.15, 1);
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .circle-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            transition: opacity 1s ease-in-out;
        }

        #cSlide1 { opacity: 1; }
        #cSlide2 { opacity: 0; }

        .content-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 40px;
            width: 100%;
            max-width: 900px;
        }

        .text-content {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translateY(0);
        }

        .text-content.hidden {
            opacity: 0;
            transform: translateY(20px);
        }

        .content-container h1 {
            font-size: 3rem;
            color: #fff;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.2;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.6);
            text-transform: uppercase;
        }

        .content-container p {
            font-size: 1.1rem;
            color: #e0e0e0;
            line-height: 1.6;
            max-width: 650px;
        }

        .next-btn {
            margin-top: 25px; /* Düyməni yuxarı qaldırdıq */
            padding: 15px 40px;
            background-color: #fff;
            color: #000;
            border: 2px solid #fff;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .next-btn:hover { background-color: #000; color: #fff; }
        .next-btn:active { transform: scale(0.95); }

        /* --- KATALOQ SƏHİFƏSİ (Adidas Üslubu) --- */
        #catalogView {
            position: absolute;
            top: 0; left: 0; right: 0;
            min-height: 100vh;
            background-color: #fff;
            color: #000;
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transform: translateY(50px);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.65, 0, 0.15, 1);
            padding: 80px 5%;
        }

        body.catalog-active {
            background-color: #fff;
        }
        
        body.catalog-active #sliderView {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        body.catalog-active #catalogView {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            z-index: 20;
        }

        .catalog-header {
            text-align: center;
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        .catalog-header h2 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .catalog-header p {
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            letter-spacing: 1px;
        }

        .category-section { margin-bottom: 70px; }

        .category-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
            margin-bottom: 30px;
            display: inline-block;
            letter-spacing: -1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .product-card {
            border: 2px solid #eee;
            padding: 25px;
            transition: border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover { border-color: #000; }

        .prod-info { flex-grow: 1; }

        .prod-name {
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .prod-desc {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Qayda 4: Miqdar tənzimləyici */
        .qty-wrapper {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .qty-label { font-weight: 800; text-transform: uppercase; font-size: 0.9rem; }

        .qty-controls {
            display: flex;
            align-items: center;
            border: 2px solid #000;
        }

        .qty-controls button {
            background: #fff;
            color: #000;
            border: none;
            width: 35px;
            height: 35px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .qty-controls button:hover { background: #000; color: #fff; }
        .qty-val { font-weight: 900; width: 40px; text-align: center; }

        /* Endirim Bildirişi */
        .discount-badge {
            background: #e60000;
            color: #fff;
            padding: 5px 10px;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 2px solid #eee;
            margin-bottom: 20px;
        }

        .price-item { display: flex; flex-direction: column; }
        .price-label { font-size: 0.75rem; text-transform: uppercase; font-weight: 800; color: #888; }
        .price-val { font-size: 1.4rem; font-weight: 900; color: #000; transition: color 0.3s; }
        .price-item.naxis { text-align: right; }
        
        .has-discount { color: #e60000; }

        .cart-btn {
            background: #000;
            color: #fff;
            border: 2px solid #000;
            padding: 15px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .cart-btn:hover { background: #fff; color: #000; }

        @media (max-width: 768px) {
            .circle-positioner { width: 100vw; height: 100vw; margin-top: -20vh; }
            .content-container h1 { font-size: 2rem; }
            .catalog-header h2 { font-size: 2.2rem; }
            .category-title { font-size: 1.5rem; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- === SLAYDER SƏHİFƏSİ === -->
    <div id="sliderView">
        <div class="bg-layer" id="bg1"></div>
        <div class="bg-layer" id="bg2"></div>
        <div class="glass-overlay"></div>

        <div class="main-container">
            <div class="circle-positioner">
                <div class="circle-spinner" id="spinner">
                    <div class="circle-slide" id="cSlide1"></div>
                    <div class="circle-slide" id="cSlide2"></div>
                </div>
            </div>

            <div class="content-container">
                <div class="text-content" id="textContent">
                    <h1 id="title"></h1>
                    <p id="desc"></p>
                </div>
                <button class="next-btn" id="nextBtn" onclick="nextAction()">Növbəti &rarr;</button>
            </div>
        </div>
    </div>

    <!-- === ADIDAS ÜSLUBUNDA KATALOQ SƏHİFƏSİ === -->
    <div id="catalogView">
        <div class="catalog-header">
            <h2>Məhsullarımız</h2>
            <p>BÜTÜN QİYMƏTLƏRƏ ƏDV DAXİLDİR. (Avtomatik endirimlər qiymətə tətbiq edilir)</p>
        </div>
        <div id="catalogContent"></div>
    </div>

    <script>
        const slides = [
            { title: "Fərdi Dizaynlar", desc: "Geyimlərin üzərində olacaq şəkilləri DTF çap və naxış toxuma üçün müştərilərin zövqünə uyğun, xüsusi olaraq dizayn edirik.", img: "https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?auto=format&fit=crop&w=1200&q=80" },
            { title: "DTF Çap Xidməti", desc: "İstənilən növ geyimlərin üzərinə yüksək keyfiyyətli, rəngarəng və uzunömürlü DTF çap tətbiq edirik.", img: "https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=1200&q=80" },
            { title: "Naxış Toxuma", desc: "Geyimlərin və müxtəlif aksesuarların üzərinə peşəkar avadanlıqlarla xüsusi naxış toxuma xidməti göstəririk.", img: "https://images.unsplash.com/photo-1624831610444-59e21896d8dd?auto=format&fit=crop&w=1200&q=80" },
            { title: "Restoran Uniformaları", desc: "Restoran işçiləri üçün rahat, davamlı və brendinizə uyğun peşəkar uniformalar və xüsusi önlüklər hazırlayırıq.", img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=1200&q=80" },
            { title: "Kepka Üzərində Loqo", desc: "Kepkaların üzərinə şirkətinizin və ya brendinizin loqosunu yüksək dəqiqliklə tətbiq edirik.", img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=1200&q=80" }
        ];

        // Qayda 3: 'Promo' sözləri məlumatlardan tamamilə silindi
        const productsData = [
            {
                categoryId: 0,
                category: "Aksesuarlar", // "Aksesuarlar və Promo" əvəzinə
                items: [
                    { name: "Bandana", desc: "Standart", price: "7", naxis: "11" },
                    { name: "Şərf", desc: "Standart", price: "11", naxis: "15" },
                    { name: "Kepka (Cırtlı)", desc: "Standart / Cırt bərkitməli", price: "15", naxis: "19" },
                    { name: "Kepka (Dəmirli)", desc: "Dəmir toqqalı bərkitmə", price: "11", naxis: "15" },
                    { name: "Qalstuk", desc: "Standart", price: "17", naxis: "21" },
                    { name: "Eko Çanta", desc: "Lacos, 65/35 ilkra qarışımlı", price: "14", naxis: "18" }
                ]
            },
            {
                categoryId: 1,
                category: "Tekstil və Geyim Məhsulları",
                items: [
                    { name: "Bağça / Məktəbli Geyimi", desc: "Uşaq tekstili", price: "11", naxis: "15" },
                    { name: "T-shirt (Süprem)", desc: "Süprem (90% pambıq, likralı)", price: "21", naxis: "25" },
                    { name: "T-shirt (2 iplik)", desc: "2 iplik (95% pambıq)", price: "21", naxis: "25" },
                    { name: "Polo T-shirt (Lacos)", desc: "Lacos, 65/35 ilkra qarışımlı", price: "21", naxis: "25" },
                    { name: "Polo T-shirt (2 iplik)", desc: "2 iplik (95% pambıq)", price: "21", naxis: "25" },
                    { name: "Polo Sweater (Lacos)", desc: "Lacos, 65/35 ilkra qarışımlı", price: "23", naxis: "27" },
                    { name: "Polo Sweater (2 iplik)", desc: "2 iplik (95% pambıq)", price: "23", naxis: "27" },
                    { name: "Polo Sweater (3 iplik)", desc: "3 iplik (95% pambıq)", price: "23", naxis: "27" },
                    { name: "Sweater (Lacos)", desc: "Lacos, 65/35 ilkra qarışımlı", price: "21", naxis: "25" },
                    { name: "Sweater (2 iplik)", desc: "2 iplik (90-95% pambıq)", price: "23", naxis: "27" },
                    { name: "Sweater (3 iplik)", desc: "3 iplik (90-95% pambıq)", price: "25", naxis: "29" },
                    { name: "Sweater (Yarımzamok, 2 iplik)", desc: "2 iplik (95% pambıq)", price: "25", naxis: "29" },
                    { name: "Sweater (Yarımzamok, 3 iplik)", desc: "3 iplik (95% pambıq)", price: "27", naxis: "31" },
                    { name: "Sweater (Zamoklu, 2 iplik)", desc: "2 iplik (95% pambıq)", price: "28", naxis: "32" },
                    { name: "Sweater (Zamoklu, 3 iplik)", desc: "3 iplik (95% pambıq)", price: "30", naxis: "34" },
                    { name: "Hoodie (2 iplik)", desc: "2 iplik (90-95% pambıq)", price: "25", naxis: "29" },
                    { name: "Hoodie (3 iplik)", desc: "3 iplik (90-95% pambıq)", price: "27", naxis: "31" },
                    { name: "Hoodie (Zamoklu, 2 iplik)", desc: "2 iplik (90-95% pambıq)", price: "28", naxis: "32" },
                    { name: "Hoodie (Zamoklu, 3 iplik)", desc: "3 iplik (90-95% pambıq)", price: "30", naxis: "34" },
                    { name: "Şalvar (2 iplik)", desc: "2 iplik (95% pambıq)", price: "26", naxis: "30" },
                    { name: "Şalvar (3 iplik)", desc: "3 iplik (95% pambıq)", price: "28", naxis: "32" },
                    { name: "Önlük (Uzun)", desc: "Uzun biçimli önlük", price: "23", naxis: "27" },
                    { name: "Önlük (Qısa)", desc: "Qısa biçimli önlük", price: "19", naxis: "23" }
                ]
            },
            {
                categoryId: 2,
                category: "Xüsusi və İş Geyimləri",
                items: [
                    { name: "Gödəkcə (Plaşoviy)", desc: "Plaşoviy material", price: "36", naxis: "40" },
                    { name: "Gödəkcə (Təytis parça)", desc: "Təytis parça", price: "38", naxis: "42" },
                    { name: "Uzunqol İş Köynəyi", desc: "80% pambıq, 20% polyester", price: "30", naxis: "34" },
                    { name: "Aşbaz Geyimi", desc: "Xüsusi aşpaz forması", price: "42", naxis: "46" },
                    { name: "Xadimə Geyimi", desc: "Xidmətçi forması", price: "37", naxis: "41" },
                    { name: "Tibbi Xalat (Qısaqol)", desc: "Qısaqol tibbi geyim", price: "36", naxis: "40" },
                    { name: "Tibbi Xalat (Uzunqol)", desc: "Uzunqol tibbi geyim", price: "40", naxis: "44" },
                    { name: "Məzun Geyimi (Atlas parça)", desc: "Atlas parça mantiya", price: "31", naxis: "35" },
                    { name: "Məzun Geyimi (Mat parça)", desc: "Mat parça mantiya", price: "35", naxis: "39" },
                    { name: "Təhlükəsizlik Jileti", desc: "Zamoklu reflektorlu jilet", price: "20", naxis: "24" }
                ]
            }
        ];

        let currentIndex = 0;
        let currentRotation = 0;
        let isAnimating = false;
        let activeBg = 1;
        let activeSlideLayer = 1;

        function init() {
            document.getElementById('cSlide1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('bg1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('title').innerText = slides[0].title;
            document.getElementById('desc').innerText = slides[0].desc;
            renderCatalog();
        }

        // --- KATALOQ RENDERING ---
        function renderCatalog() {
            const container = document.getElementById('catalogContent');
            let html = '';

            productsData.forEach(cat => {
                html += `
                    <div class="category-section">
                        <div class="category-title">${cat.category}</div>
                        <div class="product-grid">
                `;
                
                cat.items.forEach(item => {
                    html += `
                        <div class="product-card" data-cat="${cat.categoryId}" data-price="${item.price}" data-naxis="${item.naxis}">
                            <div class="prod-info">
                                <div class="prod-name">${item.name}</div>
                                <div class="prod-desc">${item.desc}</div>
                            </div>
                            
                            <div class="qty-wrapper">
                                <span class="qty-label">Miqdar:</span>
                                <div class="qty-controls">
                                    <button onclick="updateQty(this, -1)">-</button>
                                    <span class="qty-val">1</span>
                                    <button onclick="updateQty(this, 1)">+</button>
                                </div>
                            </div>

                            <div class="discount-badge">Endirim tətbiq edildi!</div>

                            <div class="price-box">
                                <div class="price-item">
                                    <span class="price-label">Sadə (Yekun)</span>
                                    <span class="price-val sadə-val">${item.price} AZN</span>
                                </div>
                                <div class="price-item naxis">
                                    <span class="price-label">Naxışlı (Yekun)</span>
                                    <span class="price-val naxis-val">${item.naxis} AZN</span>
                                </div>
                            </div>
                            <button class="cart-btn" onclick="addToCart(this)">Səbətə Əlavə Et</button>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        // Qaydalar 5, 6, 7, 8: Endirimin hesablanması və Miqdarın yenilənməsi
        function updateQty(btn, delta) {
            const card = btn.closest('.product-card');
            const qtySpan = card.querySelector('.qty-val');
            let qty = parseInt(qtySpan.innerText) + delta;
            
            if(qty < 1) qty = 1;
            qtySpan.innerText = qty;

            const catIdx = parseInt(card.getAttribute('data-cat'));
            const baseS = parseInt(card.getAttribute('data-price'));
            const baseN = parseInt(card.getAttribute('data-naxis'));

            let discount = 0;
            // Endirim məntiqi ardıcıllıqla üstünlük təşkil edir:
            if (qty > 6) discount = 1;                                        // >6 olarsa 1 AZN
            if (qty >= 10) discount = 2;                                      // 10+ olarsa 2 AZN
            if (qty >= 15 && (catIdx === 1 || catIdx === 2)) discount = 3;    // Təkcə 1 və 2-ci kat, 15+ olarsa 3 AZN
            if (qty >= 20 && catIdx === 1) discount = 4;                      // Təkcə 1-ci kat, 20+ olarsa 4 AZN

            const finalS = Math.max(0, baseS - discount) * qty;
            const finalN = Math.max(0, baseN - discount) * qty;

            const valS = card.querySelector('.sadə-val');
            const valN = card.querySelector('.naxis-val');
            const badge = card.querySelector('.discount-badge');

            valS.innerText = finalS + " AZN";
            valN.innerText = finalN + " AZN";

            if (discount > 0) {
                badge.innerText = `Hər məhsula ${discount} AZN endirim!`;
                badge.style.display = "block";
                valS.classList.add('has-discount');
                valN.classList.add('has-discount');
            } else {
                badge.style.display = "none";
                valS.classList.remove('has-discount');
                valN.classList.remove('has-discount');
            }
        }

        function addToCart(btn) {
            btn.innerText = "✓ SƏBƏTƏ ƏLAVƏ EDİLDİ";
            btn.style.background = "#4CAF50";
            btn.style.borderColor = "#4CAF50";
            btn.style.color = "#fff";
            
            setTimeout(() => {
                btn.innerText = "SƏBƏTƏ ƏLAVƏ ET";
                btn.style.background = "#000";
                btn.style.borderColor = "#000";
            }, 2500);
        }

        // --- SLAYD KEÇİD ANIMASİYASI ---
        function nextAction() {
            if (isAnimating) return;

            // Əgər sonuncu slayddayıqsa, Kataloqa keçid et
            if (currentIndex === slides.length - 1) {
                document.documentElement.classList.add('scroll-active');
                document.body.classList.add('catalog-active', 'scroll-active');
                
                // Slideri tamamilə gizlədirik ki, ekranı tutmasın və scrolla mane olmasın
                setTimeout(() => {
                    document.getElementById('sliderView').style.display = 'none';
                }, 1000); 
                return;
            }

            isAnimating = true;
            currentIndex++;
            currentRotation -= 360;

            const textContent = document.getElementById('textContent');
            const spinner = document.getElementById('spinner');
            const nextBtn = document.getElementById('nextBtn');

            // Son slayd üçün düymənin mətni
            if (currentIndex === slides.length - 1) {
                setTimeout(() => { nextBtn.innerText = "Kataloqa Keçid"; }, 500);
            }

            // Arxa plan Keçidi
            const nextBg = activeBg === 1 ? 2 : 1;
            document.getElementById(`bg${nextBg}`).style.backgroundImage = `url('${slides[currentIndex].img}')`;
            document.getElementById(`bg${nextBg}`).style.opacity = 1;
            document.getElementById(`bg${activeBg}`).style.opacity = 0;
            activeBg = nextBg;

            // Dairə İçi Şəkil Keçidi
            const nextLayer = activeSlideLayer === 1 ? 2 : 1;
            document.getElementById(`cSlide${nextLayer}`).style.backgroundImage = `url('${slides[currentIndex].img}')`;
            document.getElementById(`cSlide${nextLayer}`).style.opacity = 1;
            document.getElementById(`cSlide${activeSlideLayer}`).style.opacity = 0;
            activeSlideLayer = nextLayer;

            textContent.classList.add('hidden');
            spinner.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                document.getElementById('title').innerText = slides[currentIndex].title;
                document.getElementById('desc').innerText = slides[currentIndex].desc;
                textContent.classList.remove('hidden');
                isAnimating = false;
            }, 600);
        }

        init();
    </script>
</body>
</html>
