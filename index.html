<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Səyahət Saytı - Fırlanan Qalereya</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #e0f7fa;
            transition: background-color 1s ease;
            color: #333;
        }
        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            align-items: center;
            justify-content: space-around;
            gap: 40px;
        }
        /* Fırlanan dairənin dizaynı */
        .wheel-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        /* Dairənin 4 hissəsi */
        .quadrant {
            position: absolute;
            width: 50%;
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-size: cover;
            background-position: center;
        }
        /* Şəkilləri bura əlavə edə bilərsiniz (URL-ləri dəyişin) */
        .q1 { top: 0; left: 0; background-color: #0288d1; /* Dubai */ }
        .q2 { top: 0; right: 0; background-color: #e64a19; /* India */ }
        .q3 { bottom: 0; right: 0; background-color: #7b1fa2; /* Paris */ }
        .q4 { bottom: 0; left: 0; background-color: #d32f2f; /* Japan */ }

        /* Məlumat paneli */
        .info-panel {
            flex: 1;
            max-width: 500px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .info-panel h1 {
            font-size: 4em;
            margin: 0 0 15px 0;
            color: #111;
        }
        .info-panel p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #555;
        }
        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dairəyə kliklədikdə JavaScript funksiyası işə düşür -->
        <div class="wheel-wrapper" id="wheel" onclick="rotateWheel()">
            <div class="quadrant q1">Dubai</div>
            <div class="quadrant q2">India</div>
            <div class="quadrant q3">Paris</div>
            <div class="quadrant q4">Japan</div>
        </div>

        <div class="info-panel" id="info">
            <h1 id="title">Dubai</h1>
            <p id="desc">Dubay, Birləşmiş Ərəb Əmirliklərində dəbdəbəli alış-verişi, ultramüasir memarlığı və canlı gecə həyatı ilə tanınan şəhərdir.</p>
        </div>
    </div>
    <div class="hint">Dairənin üzərinə klikləyərək fırladın</div>

        let currentRotation = 0;
        let currentIndex = 0;
