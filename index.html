<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pura Thread - Geyim və Çap Xidmətləri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        /* QARA ÇIXINTI XƏTASININ HƏLLİ */
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100%;
            overflow-x: hidden; /* Sağdakı qara boşluğu ləğv edir */
            font-family: 'Poppins', sans-serif;
            background-color: #000;
        }

        html.scroll-active, body.scroll-active {
            overflow-y: auto !important;
            height: auto !important;
            background-color: #fff; /* Kataloqa keçəndə qara arxa planı tamamilə ağ edir */
        }

        /* --- LOQO --- */
        .brand-logo {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            width: 150px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            transition: opacity 0.5s ease;
        }

        /* --- HAMBURGER DÜYMƏSİ --- */
        .hamburger-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 45px;
            height: 45px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateX(-50px) rotate(-180deg);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .hamburger-btn:hover { transform: scale(1.1); }
        .hamburger-btn span {
            display: block;
            width: 20px;
            height: 3px;
            background: #000;
            margin: 2px 0;
            transition: 0.4s;
        }

        body.catalog-active .hamburger-btn {
            opacity: 1;
            transform: translateX(0) rotate(0);
            pointer-events: auto;
        }

        /* --- SƏBƏT DÜYMƏSİ --- */
        .floating-cart-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: #000;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            z-index: 9998;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-size: 1.5rem;
            border: 3px solid #fff;
            opacity: 0;
            pointer-events: none;
            transform: scale(0);
        }
        body.catalog-active .floating-cart-btn {
            opacity: 1; pointer-events: auto; transform: scale(1);
        }
        .floating-cart-btn:hover { transform: translateY(-5px) scale(1.05); }
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e60000;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 900;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }

        /* --- SİDEBAR VƏ ƏLAQƏ PANELİ --- */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed;
            top: 0;
            width: 380px;
            max-width: 100%;
            height: 100%;
            background: #fff;
            z-index: 10001;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        #contactSidebar { left: 0; transform: translateX(-100%); }
        #contactSidebar.active { transform: translateX(0); }
        #cartSidebar { right: 0; transform: translateX(100%); }
        #cartSidebar.active { transform: translateX(0); }

        .close-sidebar {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
            font-weight: 800;
        }

        /* --- TƏKMİLLƏŞDİRİLMİŞ ƏLAQƏ DİZAYNI --- */
        .contact-header { text-align: center; margin-bottom: 30px; }
        .contact-header img { width: 140px; margin-bottom: 20px; }
        .contact-title { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; border-bottom: 3px solid #000; padding-bottom: 10px; display: inline-block; }

        .contact-list { display: flex; flex-direction: column; gap: 15px; }
        .contact-link {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f9f9f9;
            border-radius: 12px;
            text-decoration: none;
            color: #000;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .contact-link:hover { border-color: #000; background: #fff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        
        .icon-box {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            background: #000; color: #fff;
            border-radius: 50%; margin-right: 15px; flex-shrink: 0;
        }
        .icon-box svg { width: 20px; height: 20px; fill: currentColor; }
        
        .contact-info { display: flex; flex-direction: column; }
        .contact-info strong { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; }
        .contact-info span { font-size: 0.9rem; color: #666; font-weight: 600; margin-top: 2px; }

        /* --- SƏBƏT DİZAYNI --- */
        .sidebar-title { font-size: 2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 30px; border-bottom: 4px solid #000; padding-bottom: 10px; }
        .cart-items-container { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .cart-item-info { flex-grow: 1; padding-right: 10px; }
        .cart-item-title { font-weight: 800; font-size: 1rem; margin-bottom: 5px; }
        .cart-item-desc { font-size: 0.85rem; color: #666; font-weight: 600; }
        .cart-item-price { font-weight: 900; font-size: 1.1rem; white-space: nowrap; }
        .remove-item { color: #e60000; background: none; border: none; font-size: 1.5rem; cursor: pointer; font-weight: 900; margin-left: 10px; }
        .cart-total { font-size: 1.5rem; font-weight: 900; text-align: right; margin-bottom: 20px; text-transform: uppercase; }
        .checkout-btn { background: #25D366; color: #fff; border: none; padding: 18px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; cursor: pointer; width: 100%; border-radius: 50px; transition: all 0.3s; }
        .checkout-btn:hover { background: #1ebe5d; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37,211,102,0.4); }

        /* --- SLAYDER (GİRİŞ) SƏHİFƏSİ --- */
        #sliderView { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 10; overflow: hidden; transition: opacity 1s ease-in-out, transform 1s cubic-bezier(0.65, 0, 0.15, 1); }
        .bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 1.2s ease; z-index: 1; }
        #bg1 { opacity: 1; }
        #bg2 { opacity: 0; }
        .glass-overlay { position: absolute; inset: 0; backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.85)); z-index: 2; }
        
        .main-container { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; }
        .circle-positioner { position: relative; width: 60vh; height: 60vh; margin-top: -5vh; margin-bottom: 2vh; flex-shrink: 0; }
        .circle-spinner { width: 100%; height: 100%; border-radius: 50%; position: relative; transition: transform 1.2s cubic-bezier(0.65, 0, 0.15, 1); box-shadow: 0 15px 50px rgba(0,0,0,0.8); overflow: hidden; }
        .circle-slide { position: absolute; inset: 0; background-size: cover; background-position: center; border-radius: 50%; transition: opacity 1s ease-in-out; }
        #cSlide1 { opacity: 1; }
        #cSlide2 { opacity: 0; }
        
        .content-container { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; width: 100%; max-width: 900px; }
        .text-content { transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1; transform: translateY(0); }
        .text-content.hidden { opacity: 0; transform: translateY(20px); }
        .content-container h1 { font-size: 3rem; color: #fff; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
        .content-container p { font-size: 1.1rem; color: #e0e0e0; line-height: 1.6; max-width: 650px; }
        .next-btn { margin-top: 25px; padding: 15px 40px; background-color: #fff; color: #000; border: 2px solid #fff; border-radius: 50px; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        .next-btn:hover { background-color: #000; color: #fff; }

        /* --- KATALOQ SƏHİFƏSİ --- */
        #catalogView { position: absolute; top: 0; left: 0; width: 100%; min-height: 100vh; background-color: #fff; color: #000; z-index: 5; opacity: 0; visibility: hidden; transform: translateY(50px); transition: opacity 1s ease, transform 1s cubic-bezier(0.65, 0, 0.15, 1); padding: 100px 5% 50px 5%; box-sizing: border-box; }
        body.catalog-active #sliderView { opacity: 0; transform: scale(1.05); pointer-events: none; }
        body.catalog-active #catalogView { opacity: 1; visibility: visible; transform: translateY(0); z-index: 20; }
        
        .catalog-header { text-align: center; margin-bottom: 40px; }
        .catalog-header img { width: 150px; margin-bottom: 20px; }
        .catalog-header h2 { font-size: 3rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; text-transform: uppercase; }
        .catalog-header p { font-size: 1rem; font-weight: 600; color: #666; text-transform: uppercase;}
        
        .category-menu { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 60px; position: sticky; top: 10px; z-index: 100; padding: 10px 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); }
        .cat-btn { background: #f0f0f0; color: #000; border: 2px solid transparent; padding: 12px 25px; font-weight: 800; text-transform: uppercase; border-radius: 50px; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; }
        .cat-btn:hover, .cat-btn.active { background: #000; color: #fff; border-color: #000; }

        .category-section { margin-bottom: 70px; scroll-margin-top: 100px; }
        .category-title { font-size: 2rem; font-weight: 900; text-transform: uppercase; border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 30px; display: inline-block; }
        
        /* 2 Sütunlu Məhsul Düzülüşü */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        
        .product-card { border: 2px solid #eee; padding: 20px; transition: border-color 0.3s ease; display: flex; flex-direction: column; background: #fff; border-radius: 12px; }
        .product-card:hover { border-color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .product-img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; background: #f9f9f9; }

        .prod-info { flex-grow: 1; }
        .prod-name { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; line-height: 1.2; }
        .prod-desc { font-size: 0.95rem; color: #666; margin-bottom: 20px; font-weight: 600; }

        .type-selector { width: 100%; padding: 12px; margin-bottom: 15px; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; border: 2px solid #eee; border-radius: 8px; outline: none; cursor: pointer; }
        .type-selector:focus { border-color: #000; }

        .qty-wrapper { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .qty-label { font-weight: 800; text-transform: uppercase; font-size: 0.9rem; }
        .qty-controls { display: flex; align-items: center; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
        .qty-controls button { background: #fff; color: #000; border: none; width: 35px; height: 35px; font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .qty-controls button:hover { background: #000; color: #fff; }
        .qty-val { font-weight: 900; width: 40px; text-align: center; }

        .discount-badge { background: #e60000; color: #fff; padding: 5px 10px; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 15px; display: none; text-align: center; border-radius: 5px; }
        
        .price-box { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 2px solid #eee; margin-bottom: 20px; }
        .price-item { display: flex; flex-direction: column; }
        .price-label { font-size: 0.75rem; text-transform: uppercase; font-weight: 800; color: #888; }
        .price-val { font-size: 1.3rem; font-weight: 900; color: #000; transition: color 0.3s; }
        .price-item.naxis { text-align: right; }
        .has-discount { color: #e60000; }

        .cart-btn { background: #000; color: #fff; border: 2px solid #000; border-radius: 8px; padding: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: all 0.3s; width: 100%; }
        .cart-btn:hover { background: #fff; color: #000; }

        @media (max-width: 768px) {
            .circle-positioner { width: 100vw; height: 100vw; margin-top: -15vh; }
            .content-container h1 { font-size: 2rem; }
            .product-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .product-img { height: 160px; margin-bottom: 10px;}
            .product-card { padding: 10px; }
            .prod-name { font-size: 1rem; }
            .prod-desc { font-size: 0.8rem; margin-bottom: 10px; }
            .price-val { font-size: 1rem; }
            .price-label { font-size: 0.65rem; }
            .qty-wrapper { flex-direction: column; align-items: flex-start; gap: 5px; }
            .sidebar { width: 320px; }
            .floating-cart-btn { bottom: 20px; right: 20px; width: 60px; height: 60px; }
            .cat-btn { padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>

            <button class="cat-btn active" onclick="scrollToCat('cat-0', this)">Aksesuarlar</button>
            <button class="cat-btn" onclick="scrollToCat('cat-1', this)">Tekstil və Geyim</button>
            <button class="cat-btn" onclick="scrollToCat('cat-2', this)">İş Geyimləri</button>
        </div>

        <div id="catalogContent"></div>
    </div>

    <script>
        const slides = [
            { title: "Fərdi Dizaynlar", desc: "Geyimlərin üzərində olacaq şəkilləri DTF çap və naxış toxuma üçün müştərilərin zövqünə uyğun dizayn edirik.", img: "https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?auto=format&fit=crop&w=1200&q=80" },
            { title: "DTF Çap Xidməti", desc: "İstənilən növ geyimlərin üzərinə yüksək keyfiyyətli, rəngarəng və uzunömürlü DTF çap tətbiq edirik.", img: "https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=1200&q=80" },
            { title: "Naxış Toxuma", desc: "Geyimlərin və müxtəlif aksesuarların üzərinə peşəkar avadanlıqlarla xüsusi naxış toxuma xidməti göstəririk.", img: "https://images.unsplash.com/photo-1624831610444-59e21896d8dd?auto=format&fit=crop&w=1200&q=80" },
            { title: "Restoran Uniformaları", desc: "Restoran işçiləri üçün rahat, davamlı və brendinizə uyğun peşəkar uniformalar və xüsusi önlüklər hazırlayırıq.", img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=1200&q=80" },
            { title: "Kepka Üzərində Loqo", desc: "Kepkaların üzərinə şirkətinizin və ya brendinizin loqosunu yüksək dəqiqliklə tətbiq edirik.", img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=1200&q=80" }
        ];

        const productsData = [
            { categoryId: 0, category: "Aksesuarlar", items: [
                { name: "Bandana", desc: "Standart", price: "7", naxis: "11", img: "https://images.unsplash.com/photo-1579621970222-7722955f0535?auto=format&fit=crop&w=600&q=80" },
                { name: "Şərf", desc: "Standart", price: "11", naxis: "15", img: "https://images.unsplash.com/photo-1520903920243-00d872a2d1c9?auto=format&fit=crop&w=600&q=80" },
                { name: "Kepka (Cırtlı)", desc: "Standart / Cırt bərkitməli", price: "15", naxis: "19", img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=600&q=80" },
                { name: "Kepka (Dəmirli)", desc: "Dəmir toqqalı bərkitmə", price: "11", naxis: "15", img: "https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?auto=format&fit=crop&w=600&q=80" },
                { name: "Qalstuk", desc: "Standart", price: "17", naxis: "21", img: "https://images.unsplash.com/photo-1589756804561-12c8ff186b51?auto=format&fit=crop&w=600&q=80" },
                { name: "Eko Çanta", desc: "Lacos, 65/35 ilkra qarışımlı", price: "14", naxis: "18", img: "https://images.unsplash.com/photo-1597484661643-2f5fef640df1?auto=format&fit=crop&w=600&q=80" }
            ]},
            { categoryId: 1, category: "Tekstil və Geyim", items: [
                { name: "Bağça / Məktəbli", desc: "Uşaq tekstili", price: "11", naxis: "15", img: "https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=600&q=80" },
                { name: "T-shirt (Süprem)", desc: "Süprem (90% pambıq, likralı)", price: "21", naxis: "25", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80" },
                { name: "T-shirt (2 iplik)", desc: "2 iplik (95% pambıq)", price: "21", naxis: "25", img: "https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&w=600&q=80" },
                { name: "Polo (Lacos)", desc: "Lacos, 65/35 ilkra qarışımlı", price: "21", naxis: "25", img: "https://images.unsplash.com/photo-1628148906103-68f44d85834d?auto=format&fit=crop&w=600&q=80" },
                { name: "Polo (2 iplik)", desc: "2 iplik (95% pambıq)", price: "21", naxis: "25", img: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?auto=format&fit=crop&w=600&q=80" },
                { name: "Sweater Polo", desc: "Lacos, 65/35 qarışımlı", price: "23", naxis: "27", img: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=600&q=80" },
                { name: "Sweater (2 iplik)", desc: "2 iplik (90-95% pambıq)", price: "23", naxis: "27", img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=600&q=80" },
                { name: "Sweater (3 iplik)", desc: "3 iplik (90-95% pambıq)", price: "25", naxis: "29", img: "https://images.unsplash.com/photo-1614975059251-992f11792b9f?auto=format&fit=crop&w=600&q=80" },
                { name: "Hoodie (2 iplik)", desc: "2 iplik (90-95% pambıq)", price: "25", naxis: "29", img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=600&q=80" },
                { name: "Hoodie (Zamoklu)", desc: "2 iplik (90-95% pambıq)", price: "28", naxis: "32", img: "https://images.unsplash.com/photo-1509942774463-acf339cf87d5?auto=format&fit=crop&w=600&q=80" },
                { name: "Şalvar (2 iplik)", desc: "2 iplik (95% pambıq)", price: "26", naxis: "30", img: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=600&q=80" },
                { name: "Şalvar (3 iplik)", desc: "3 iplik (95% pambıq)", price: "28", naxis: "32", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=600&q=80" },
                { name: "Önlük (Uzun)", desc: "Uzun biçimli önlük", price: "23", naxis: "27", img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=600&q=80" },
                { name: "Önlük (Qısa)", desc: "Qısa biçimli önlük", price: "19", naxis: "23", img: "https://images.unsplash.com/photo-1600609842340-90ff66041697?auto=format&fit=crop&w=600&q=80" }
            ]},
            { categoryId: 2, category: "İş Geyimləri", items: [
                { name: "Gödəkcə (Plaşoviy)", desc: "Plaşoviy material", price: "36", naxis: "40", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80" },
                { name: "Uzunqol İş Köynəyi", desc: "80% pambıq, 20% polyester", price: "30", naxis: "34", img: "https://images.unsplash.com/photo-1596755094514-f87e32f85e2c?auto=format&fit=crop&w=600&q=80" },
                { name: "Aşbaz Geyimi", desc: "Xüsusi aşpaz forması", price: "42", naxis: "46", img: "https://images.unsplash.com/photo-1577219491135-ce391730fb2c?auto=format&fit=crop&w=600&q=80" },
                { name: "Xadimə Geyimi", desc: "Xidmətçi forması", price: "37", naxis: "41", img: "https://images.unsplash.com/photo-1584988647573-04dcdd60f9e2?auto=format&fit=crop&w=600&q=80" },
                { name: "Tibbi Xalat", desc: "Qısa/Uzun tibbi geyim", price: "36", naxis: "40", img: "https://images.unsplash.com/photo-1584036561566-baf8f5f1b144?auto=format&fit=crop&w=600&q=80" },
                { name: "Məzun Geyimi", desc: "Atlas/Mat parça mantiya", price: "31", naxis: "35", img: "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=600&q=80" },
                { name: "Təhlükəsizlik Jileti", desc: "Zamoklu reflektorlu", price: "20", naxis: "24", img: "https://images.unsplash.com/photo-1589410976150-f1ce6ccabdb4?auto=format&fit=crop&w=600&q=80" }
            ]}
        ];

        let cart = [];
        let currentIndex = 0, currentRotation = 0, isAnimating = false;
        let activeBg = 1, activeSlideLayer = 1;

        function init() {
            document.getElementById('cSlide1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('bg1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('title').innerText = slides[0].title;
            document.getElementById('desc').innerText = slides[0].desc;
            renderCatalog();
        }

        function toggleContact() { document.getElementById('sidebarOverlay').classList.add('active'); document.getElementById('contactSidebar').classList.add('active'); }
        function toggleCart() { document.getElementById('sidebarOverlay').classList.add('active'); document.getElementById('cartSidebar').classList.add('active'); }
        function closeAllSidebars() { document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('contactSidebar').classList.remove('active'); document.getElementById('cartSidebar').classList.remove('active'); }

        function scrollToCat(id, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const el = document.getElementById(id);
            if(el) {
                const yOffset = -80; 
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({top: y, behavior: 'smooth'});
            }
        }

        function renderCatalog() {
            const container = document.getElementById('catalogContent');
            let html = '';
            productsData.forEach(cat => {
                html += `<div class="category-section" id="cat-${cat.categoryId}"><div class="category-title">${cat.category}</div><div class="product-grid">`;
                cat.items.forEach(item => {
                    html += `
                        <div class="product-card" data-cat="${cat.categoryId}" data-price="${item.price}" data-naxis="${item.naxis}" data-fsade="${item.price}" data-fnaxis="${item.naxis}">
                            <img src="${item.img}" alt="${item.name}" class="product-img">
                            <div class="prod-info">
                                <div class="prod-name">${item.name}</div>
                                <div class="prod-desc">${item.desc}</div>
                            </div>
                            <select class="type-selector">
                                <option value="sade">Növ: Sadə Çap</option>
                                <option value="naxis">Növ: Naxış Toxuma</option>
                            </select>
                            <div class="qty-wrapper">
                                <span class="qty-label">Miqdar:</span>
                                <div class="qty-controls">
                                    <button onclick="updateQty(this, -1)">-</button>
                                    <span class="qty-val">1</span>
                                    <button onclick="updateQty(this, 1)">+</button>
                                </div>
                            </div>
                            <div class="discount-badge">Endirim tətbiq edildi!</div>
                            <div class="price-box">
                                <div class="price-item"><span class="price-label">Sadə (Ədəd)</span><span class="price-val sadə-val">${item.price} AZN</span></div>
                                <div class="price-item naxis"><span class="price-label">Naxışlı (Ədəd)</span><span class="price-val naxis-val">${item.naxis} AZN</span></div>
                            </div>
                            <button class="cart-btn" onclick="addToCart(this)">Səbətə Əlavə Et</button>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function updateQty(btn, delta) {
            const card = btn.closest('.product-card');
            const qtySpan = card.querySelector('.qty-val');
            let qty = parseInt(qtySpan.innerText) + delta;
            if(qty < 1) qty = 1;
            qtySpan.innerText = qty;

            const catIdx = parseInt(card.getAttribute('data-cat'));
            const baseS = parseInt(card.getAttribute('data-price'));
            const baseN = parseInt(card.getAttribute('data-naxis'));

            let discount = 0;
            if (qty > 6) discount = 1;
            if (qty >= 10) discount = 2;
            if (qty >= 15 && (catIdx === 1 || catIdx === 2)) discount = 3;
            if (qty >= 20 && catIdx === 1) discount = 4;

            const unitS = Math.max(0, baseS - discount);
            const unitN = Math.max(0, baseN - discount);
            card.setAttribute('data-fsade', unitS);
            card.setAttribute('data-fnaxis', unitN);

            const valS = card.querySelector('.sadə-val');
            const valN = card.querySelector('.naxis-val');
            const badge = card.querySelector('.discount-badge');

            valS.innerText = unitS + " AZN";
            valN.innerText = unitN + " AZN";

            if (discount > 0) {
                badge.innerText = `Hər məhsula ${discount} AZN endirim!`;
                badge.style.display = "block";
                valS.classList.add('has-discount'); valN.classList.add('has-discount');
            } else {
                badge.style.display = "none";
                valS.classList.remove('has-discount'); valN.classList.remove('has-discount');
            }
        }

        function addToCart(btn) {
            const card = btn.closest('.product-card');
            const name = card.querySelector('.prod-name').innerText;
            const qty = parseInt(card.querySelector('.qty-val').innerText);
            const type = card.querySelector('.type-selector').value;
            
            let unitPrice = (type === 'sade') ? parseInt(card.getAttribute('data-fsade')) : parseInt(card.getAttribute('data-fnaxis'));
            let typeName = (type === 'sade') ? "Sadə Çap" : "Naxış Toxuma";
            let totalPrice = unitPrice * qty;

            cart.push({ name, typeName, qty, unitPrice, totalPrice });
            
            btn.innerText = "✓ ƏLAVƏ EDİLDİ";
            btn.style.background = "#25D366";
            btn.style.borderColor = "#25D366";
            setTimeout(() => { btn.innerText = "SƏBƏTƏ ƏLAVƏ ET"; btn.style.background = "#000"; btn.style.borderColor = "#000"; }, 1500);

            refreshCartUI();
        }

        function removeFromCart(index) { cart.splice(index, 1); refreshCartUI(); }

        function refreshCartUI() {
            const cartBody = document.getElementById('cartItems');
            document.getElementById('cartBadge').innerText = cart.length;
            
            let total = 0;
            if(cart.length === 0) {
                cartBody.innerHTML = '<p style="color:#666; font-weight:600;">Səbətiniz hal-hazırda boşdur.</p>';
            } else {
                let html = "";
                cart.forEach((item, index) => {
                    total += item.totalPrice;
                    html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-desc">${item.typeName} | ${item.qty} ədəd x ${item.unitPrice} AZN</div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <div class="cart-item-price">${item.totalPrice} AZN</div>
                            <button class="remove-item" onclick="removeFromCart(${index})">&times;</button>
                        </div>
                    </div>`;
                });
                cartBody.innerHTML = html;
            }
            document.getElementById('cartTotal').innerText = total + " AZN";
        }

        function checkout() {
            if(cart.length === 0) { alert("Sifariş vermək üçün səbətə məhsul əlavə edin."); return; }
            let text = "Salam, mən saytınızdan aşağıdakı məhsulları sifariş vermək istəyirəm:%0A%0A";
            let total = 0;
            cart.forEach((item, i) => {
                text += `${i+1}. ${item.name}%0A   Növ: ${item.typeName}%0A   Miqdar: ${item.qty} ədəd%0A   Məbləğ: ${item.totalPrice} AZN%0A%0A`;
                total += item.totalPrice;
            });
            text += `*ÜMUMİ MƏBLƏĞ: ${total} AZN*`;
            window.open(`https://wa.me/994554347619?text=${text}`, '_blank');
        }

        function nextAction() {
            if (isAnimating) return;
            if (currentIndex === slides.length - 1) {
                document.documentElement.classList.add('scroll-active');
                document.body.classList.add('catalog-active', 'scroll-active');
                document.getElementById('mainLogo').style.opacity = '0';
                setTimeout(() => { document.getElementById('sliderView').style.display = 'none'; }, 1000); 
                return;
            }

            isAnimating = true;
            currentIndex++;
            currentRotation -= 360;

            const textContent = document.getElementById('textContent');
            const spinner = document.getElementById('spinner');
            const nextBtn = document.getElementById('nextBtn');

            if (currentIndex === slides.length - 1) setTimeout(() => { nextBtn.innerText = "Kataloqa Keçid"; }, 500);

            const nextBg = activeBg === 1 ? 2 : 1;
            document.getElementById(`bg${nextBg}`).style.backgroundImage = `url('${slides[currentIndex].img}')`;
            document.getElementById(`bg${nextBg}`).style.opacity = 1;
            document.getElementById(`bg${activeBg}`).style.opacity = 0;
            activeBg = nextBg;

            const nextLayer = activeSlideLayer === 1 ? 2 : 1;
            document.getElementById(`cSlide${nextLayer}`).style.backgroundImage = `url('${slides[currentIndex].img}')`;
            document.getElementById(`cSlide${nextLayer}`).style.opacity = 1;
            document.getElementById(`cSlide${activeSlideLayer}`).style.opacity = 0;
            activeSlideLayer = nextLayer;

            textContent.classList.add('hidden');
            spinner.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                document.getElementById('title').innerText = slides[currentIndex].title;
                document.getElementById('desc').innerText = slides[currentIndex].desc;
                textContent.classList.remove('hidden');
                isAnimating = false;
            }, 600);
        }

        init();
    </script>
</body>
</html>
