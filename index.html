<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xüsusi Geyim və Çap Xidmətləri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #000;
        }

        /* YENİ VƏ QÜSURSUZ ARXA PLAN METODU (Çərçivə problemi yoxdur) */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1.2s ease-in-out;
            z-index: 1;
        }

        #bg1 { opacity: 1; }
        #bg2 { opacity: 0; }

        /* Arxa planın üzərindəki şüşə effekti (Blur) və tündləşdirmə */
        .glass-overlay {
            position: fixed;
            inset: 0;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.85));
            z-index: 2;
        }

        /* ƏSAS DÜZÜLÜŞ (Yuxarıdan aşağı) */
        .main-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
        }

        /* Dairə yuxarıda */
        .circle-positioner {
            position: relative;
            width: 70vh;
            height: 70vh;
            margin-top: -15vh;
            flex-shrink: 0;
        }

        /* Fırlanan Dairə */
        .circle-spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.15, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Şəkillər Qatı */
        .circle-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            transition: opacity 1s ease-in-out;
        }

        #cSlide1 { opacity: 1; }
        #cSlide2 { opacity: 0; }

        /* Məlumat Paneli Altda */
        .content-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px 40px;
            width: 100%;
            max-width: 900px;
        }

        .text-content {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translateY(0);
        }

        .text-content.hidden {
            opacity: 0;
            transform: translateY(30px);
        }

        h1 {
            font-size: 3.5rem;
            color: #fff;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.6);
            letter-spacing: -1px;
        }

        p {
            font-size: 1.15rem;
            color: #e0e0e0;
            line-height: 1.8;
            max-width: 650px;
            margin: 0 auto;
            text-shadow: 1px 2px 10px rgba(0,0,0,0.6);
        }

        /* Mərkəzlənmiş Növbəti Düyməsi */
        .next-btn {
            margin-top: 35px;
            padding: 16px 45px;
            background-color: #fff;
            color: #111;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .next-btn:active {
            transform: translateY(0) scale(0.95);
        }

        /* Mobil Ekranlar Üçün Uyğunlaşdırma */
        @media (max-width: 768px) {
            .circle-positioner {
                width: 130vw;
                height: 130vw;
                margin-top: -30vw;
            }
            .content-container {
                padding: 15px 20px;
            }
            h1 { font-size: 2.2rem; margin-bottom: 10px; }
            p { font-size: 0.95rem; line-height: 1.6; }
            .next-btn {
                padding: 14px 35px;
                font-size: 1rem;
                margin-top: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- Arxa Plan Qatları -->
    <div class="bg-layer" id="bg1"></div>
    <div class="bg-layer" id="bg2"></div>
    <div class="glass-overlay"></div>

    <div class="main-container">
        <!-- Fırlanan Dairə Yuxarıda -->
        <div class="circle-positioner">
            <div class="circle-spinner" id="spinner">
                <div class="circle-slide" id="cSlide1"></div>
                <div class="circle-slide" id="cSlide2"></div>
            </div>
        </div>

        <!-- Məlumat Və Düymə Aşağıda -->
        <div class="content-container">
            <div class="text-content" id="textContent">
                <h1 id="title"></h1>
                <p id="desc"></p>
            </div>
            <button class="next-btn" onclick="nextSlide()">Növbəti &rarr;</button>
        </div>
    </div>

    <script>
        // Biznesinizə uyğun 5 xidmət məlumatı və şəkilləri
        const slides = [
            { 
                title: "Fərdi Dizaynlar", 
                desc: "Geyimlərin üzərində olacaq şəkilləri DTF çap və naxış toxuma üçün müştərilərin zövqünə uyğun, xüsusi olaraq dizayn edirik.", 
                img: "https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?auto=format&fit=crop&w=1200&q=80" 
            },
            { 
                title: "DTF Çap Xidməti", 
                desc: "İstənilən növ geyimlərin üzərinə yüksək keyfiyyətli, rəngarəng və uzunömürlü DTF çap tətbiq edirik.", 
                img: "https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=1200&q=80" 
            },
            { 
                title: "Naxış Toxuma", 
                desc: "Geyimlərin və müxtəlif aksesuarların üzərinə peşəkar avadanlıqlarla xüsusi naxış toxuma (embroidery) xidməti göstəririk.", 
                img: "https://images.unsplash.com/photo-1624831610444-59e21896d8dd?auto=format&fit=crop&w=1200&q=80" 
            },
            { 
                title: "Restoran Uniformaları", 
                desc: "Restoran işçiləri üçün rahat, davamlı və brendinizə uyğun peşəkar uniformalar və xüsusi önlüklər hazırlayırıq.", 
                img: "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=1200&q=80" 
            },
            { 
                title: "Kepka Üzərində Loqo", 
                desc: "Kepkaların üzərinə şirkətinizin və ya brendinizin loqosunu yüksək dəqiqliklə tətbiq edirik.", 
                img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=1200&q=80" 
            }
        ];

        let currentIndex = 0;
        let currentRotation = 0;
        let isAnimating = false;
        
        let activeBg = 1;
        let activeSlideLayer = 1;

        function init() {
            document.getElementById('cSlide1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('bg1').style.backgroundImage = `url('${slides[0].img}')`;
            document.getElementById('title').innerText = slides[0].title;
            document.getElementById('desc').innerText = slides[0].desc;
        }

        function nextSlide() {
            if (isAnimating) return;
            isAnimating = true;

            currentIndex = (currentIndex + 1) % slides.length; // 5 xidmət arasında dövr edir
            currentRotation -= 360;

            const textContent = document.getElementById('textContent');
            const spinner = document.getElementById('spinner');

            // Arxa plan Keçidi
            const nextBg = activeBg === 1 ? 2 : 1;
            const currentBgEl = document.getElementById(`bg${activeBg}`);
            const nextBgEl = document.getElementById(`bg${nextBg}`);
            
            nextBgEl.style.backgroundImage = `url('${slides[currentIndex].img}')`;
            nextBgEl.style.opacity = 1;
            currentBgEl.style.opacity = 0;
            activeBg = nextBg;

            // Dairə İçi Şəkil Keçidi
            const nextSlideLayerId = activeSlideLayer === 1 ? 2 : 1;
            const currentSlideEl = document.getElementById(`cSlide${activeSlideLayer}`);
            const nextSlideEl = document.getElementById(`cSlide${nextSlideLayerId}`);
            
            nextSlideEl.style.backgroundImage = `url('${slides[currentIndex].img}')`;
            nextSlideEl.style.opacity = 1;
            currentSlideEl.style.opacity = 0;
            activeSlideLayer = nextSlideLayerId;

            // Mətni gizlət
            textContent.classList.add('hidden');

            // Dairəni fırlat
            spinner.style.transform = `rotate(${currentRotation}deg)`;

            // Yeni mətni gətir
            setTimeout(() => {
                document.getElementById('title').innerText = slides[currentIndex].title;
                document.getElementById('desc').innerText = slides[currentIndex].desc;
                textContent.classList.remove('hidden');
                isAnimating = false;
            }, 600);
        }

        init();
    </script>
</body>
</html>
